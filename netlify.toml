[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    # --- Transport Security ---
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # --- Content Security Policy ---
    # Allows: self, Plausible analytics, Formspree contact form,
    #         service worker, PWA manifest, and inline styles.
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self' https://plausible.io; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data:; \
      connect-src 'self' https://formspree.io https://plausible.io; \
      worker-src 'self'; \
      manifest-src 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      form-action 'self' https://formspree.io; \
      upgrade-insecure-requests"""

    # --- Clickjacking / Framing ---
    X-Frame-Options = "DENY"

    # --- MIME-sniffing ---
    X-Content-Type-Options = "nosniff"

    # --- XSS filter (disabled - CSP supersedes it; "0" is safest) ---
    X-XSS-Protection = "0"

    # --- Referrer ---
    Referrer-Policy = "strict-origin-when-cross-origin"

    # --- Permissions Policy (deny everything we don't use) ---
    Permissions-Policy = """
      camera=(), \
      microphone=(), \
      geolocation=(), \
      interest-cohort=(), \
      payment=(), \
      usb=(), \
      bluetooth=(), \
      serial=(), \
      hid=(), \
      ambient-light-sensor=(), \
      gyroscope=(), \
      magnetometer=(), \
      accelerometer=()"""

    # --- Cross-Origin Isolation ---
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Moved/legacy URLs.
# 301 so old links and search results migrate cleanly.
# These are the only redirects: the app is a single page with no client router,
# so there is nothing to mirror in JS. Guarded by src/tests/front-door.test.tsx.
[[redirects]]
  from = "/work"
  to = "/"
  status = 301

[[redirects]]
  from = "/writing"
  to = "/"
  status = 301

[[redirects]]
  from = "/writing/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301

# ponytail: no SPA catch-all on purpose. There are no client-side routes, so
# Netlify serves 404.html (built from ./404.html) with a real 404 status for
# anything unmatched - a catch-all would turn every typo into a soft 404 (200 +
# homepage), which search engines index as a duplicate. Add one back only if a
# real client-side route appears, and give it its own `from` rather than `/*`.

