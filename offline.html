<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Saw Ye Htet</title>
        <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
        <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
        <link rel="icon" href="/assets/favicon-32.png?v=3" sizes="32x32" type="image/png" />
        <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=3" sizes="180x180" />
        <style>
            :root {
                --paper: #f0eee6;
                --ink: #1f1e1d;
                --ink-2: #3d3d3a;
                --ink-3: #5e5d59;
                --line: #d1cfc5;
                --serif:
                    'Newsreader', Charter, 'Iowan Old Style', 'Times New Roman', Georgia, serif;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: var(--serif);
                background: var(--paper);
                color: var(--ink);
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-size: 1.25rem;
                line-height: 1.6;
                -webkit-font-smoothing: antialiased;
            }
            .offline {
                width: 100%;
                max-width: 480px;
            }
            .offline-eyebrow {
                font-family: var(--serif);
                font-size: 0.85rem;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-3);
            }
            h1 {
                margin: 8px 0 0;
                font-size: clamp(2.4rem, 7vw, 3.2rem);
                font-weight: 700;
                letter-spacing: -0.025em;
                line-height: 1.1;
            }
            p {
                max-width: 42ch;
                margin-top: 20px;
                padding-top: 20px;
                border-top: 1px solid var(--line);
                font-size: 1.15rem;
                line-height: 1.65;
                color: var(--ink-2);
            }
            .retry {
                display: inline-block;
                margin-top: 28px;
                font-family: var(--serif);
                font-size: 1.05rem;
                color: var(--ink);
                text-decoration: underline;
                text-underline-offset: 3px;
                text-decoration-color: var(--line);
                padding-bottom: 2px;
            }
            .retry:hover {
                text-decoration-color: var(--ink);
            }
        </style>
    </head>
    <body>
        <main class="offline">
            <span class="offline-eyebrow">No connection</span>
            <h1>Offline</h1>
            <p>
                This page will reconnect when your network is back. The résumé, projects, and
                contact details are all on the main site once you are online again.
            </p>
            <a class="retry" href="/">Try again &rarr;</a>
        </main>
    </body>
</html>
